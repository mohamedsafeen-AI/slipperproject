name: Build iOS App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Capacitor iOS
        run: |
          npm install
          npm install @capacitor/ios @capacitor/core @capacitor/cli

      - name: Build Web Assets & Initialize iOS Platform
        run: |
          npm run build --if-present
          npx cap add ios || true
          npx cap sync ios

      - name: Build iOS Project (.xcodeproj / .xcworkspace)
        run: |
          cd ios/App
          if [ -d "App.xcworkspace" ]; then
            xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          else
            xcodebuild -project App.xcodeproj -scheme App -configuration Release -derivedDataPath build -sdk iphoneos CODE_SIGNING_ALLOWED=NO
          fi
